[project]
name = "clichat"
version = "0.11.0"
description = "CLI chat and autonomous coding agent for local and cloud LLMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=2.23.0",
    "openai>=3.14.1",
    "prompt-toolkit>=3.0.53",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[project.scripts]
clichat = "clichat.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
