<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cyc - Web Interface</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .prose pre { background: #1e1e1e; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; }
    .prose code { color: #f87171; font-family: monospace; }
    .prose pre code { color: #f3f4f6; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #18181b; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #52525b; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 flex flex-col h-screen overflow-hidden">

  <!-- Header -->
  <header class="bg-zinc-900 border-b border-zinc-800 px-4 py-2.5 flex items-center justify-between shrink-0">
    <div class="flex items-center space-x-3">
      <span class="font-extrabold text-xl tracking-wider text-emerald-400">cyc</span>
      <span class="text-xs bg-zinc-800 text-zinc-400 px-2 py-0.5 rounded" id="appVersion">v1.6.1</span>
      <div class="hidden sm:flex items-center space-x-2 text-xs text-zinc-400 border-l border-zinc-700 pl-3">
        <span>Workspace:</span>
        <span class="text-zinc-200 font-mono" id="wsName">loading...</span>
      </div>
    </div>

    <!-- Mode & Provider Controls -->
    <div class="flex items-center space-x-3">
      <div class="flex items-center space-x-1.5 bg-zinc-950 border border-zinc-700 rounded-lg p-0.5 text-xs">
        <button id="btnModeAgent" class="px-2.5 py-1 rounded bg-emerald-600 text-white font-medium">🤖 Agent</button>
        <button id="btnModeChat" class="px-2.5 py-1 rounded text-zinc-400 hover:text-white">💬 Chat</button>
      </div>

      <select id="selectProvider" class="bg-zinc-800 border border-zinc-700 text-xs rounded-md px-2 py-1.5 text-zinc-200 focus:outline-none focus:border-emerald-500">
        <option value="">Provider</option>
      </select>

      <select id="selectModel" class="bg-zinc-800 border border-zinc-700 text-xs rounded-md px-2 py-1.5 text-zinc-200 focus:outline-none focus:border-emerald-500 max-w-[180px]">
        <option value="">Model</option>
      </select>

      <!-- Token Gauge & Compact Button -->
      <div class="hidden xl:flex items-center space-x-2 bg-zinc-950 border border-zinc-800 rounded-lg px-2.5 py-1 text-xs">
        <span class="text-zinc-400">Tokens:</span>
        <div class="w-20 bg-zinc-800 rounded-full h-2 overflow-hidden relative">
          <div id="tokenBar" class="bg-emerald-500 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
        <span id="tokenText" class="text-zinc-300 font-mono text-[11px]">0 / 128k</span>
        <button id="btnCompact" class="ml-1 px-1.5 py-0.5 bg-zinc-800 hover:bg-zinc-700 text-emerald-400 hover:text-emerald-300 rounded border border-zinc-700 font-medium" title="手動觸發上下文壓縮 (Compact Context)">
          ⚡ Compact
        </button>
      </div>

      <button id="btnToggleTerminal" class="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-200 border border-zinc-700 px-3 py-1.5 rounded-md flex items-center space-x-1" title="開啟/收合終端視窗">
        <span>💻 Terminal</span>
      </button>

      <button id="btnNewChat" class="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-200 border border-zinc-700 px-3 py-1.5 rounded-md flex items-center space-x-1">
        <span>+ New</span>
      </button>
    </div>
  </header>

  <!-- Main 3-Column Layout -->
  <div class="flex flex-1 overflow-hidden">

    <!-- Left Sidebar: Sessions & Files -->
    <aside class="w-64 bg-zinc-900/60 border-r border-zinc-800 flex flex-col shrink-0 hidden md:flex">
      <div class="p-3 border-b border-zinc-800 flex justify-between items-center text-xs font-semibold text-zinc-400">
        <span>RECENT SESSIONS</span>
        <button id="btnRefreshSessions" class="hover:text-white" title="Refresh">↻</button>
      </div>
      <div class="flex-1 overflow-y-auto p-2 space-y-1 text-xs" id="sessionList">
        <div class="text-zinc-500 p-2">載入中...</div>
      </div>

      <!-- File Explorer Drawer -->
      <div class="border-t border-zinc-800 p-3 flex justify-between items-center text-xs font-semibold text-zinc-400">
        <span>FILES EXPLORER</span>
        <button id="btnRefreshFiles" class="hover:text-white" title="Refresh">↻</button>
      </div>
      <div class="h-44 overflow-y-auto p-2 text-xs font-mono space-y-0.5" id="fileTree">
        <div class="text-zinc-500 p-2">載入目錄中...</div>
      </div>
    </aside>

    <!-- Center: Main Chat & Agent Event Stream -->
    <main class="flex-1 flex flex-col bg-zinc-950 overflow-hidden relative">
      <!-- Chat Messages Container -->
      <div class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4" id="chatContainer">
        <!-- Welcome Hero -->
        <div class="text-center my-8 text-zinc-500" id="welcomeHero">
          <div class="text-3xl mb-2">⚡</div>
          <h2 class="text-base font-medium text-zinc-300">cyc 終端與遠端自主編程代理</h2>
          <p class="text-xs text-zinc-500 mt-1">隨時發起自然語言編程提問、專案巡檢或檔案重構。</p>
        </div>
      </div>

      <!-- Input Bar -->
      <div class="p-3 sm:p-4 bg-zinc-900/80 border-t border-zinc-800 shrink-0">
        <div class="relative bg-zinc-800/90 border border-zinc-700 rounded-xl p-2 focus-within:border-emerald-500">
          <textarea id="promptInput" rows="2" class="w-full bg-transparent text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none resize-none" placeholder="輸入您的指令或提示詞 (Enter 送出, Shift+Enter 換行)..."></textarea>
          <div class="flex items-center justify-between pt-1 text-xs text-zinc-500">
            <div class="flex items-center space-x-3">
              <label class="flex items-center space-x-1 cursor-pointer hover:text-zinc-300">
                <input type="checkbox" id="checkAutoApprove" class="rounded bg-zinc-700 border-zinc-600 text-emerald-500">
                <span>免確認 (Auto Approve)</span>
              </label>

              <!-- Strategy & Max Turns -->
              <div class="hidden sm:flex items-center space-x-1.5 border-l border-zinc-700 pl-2">
                <span class="text-zinc-400">Loop:</span>
                <select id="selectStrategy" class="bg-zinc-800 border border-zinc-700 text-zinc-200 text-[11px] rounded px-1.5 py-0.5 focus:outline-none">
                  <option value="standard">standard</option>
                  <option value="plan">plan</option>
                  <option value="minimal">minimal</option>
                </select>
                <input type="number" id="inputMaxTurns" value="100" min="1" max="500" class="w-12 bg-zinc-800 border border-zinc-700 text-zinc-200 text-[11px] rounded px-1 py-0.5 text-center focus:outline-none" title="Agent 最大循環輪數 (Max Turns)">
              </div>

              <!-- Stream Channel Toggle: WS or SSE -->
              <div class="hidden md:flex items-center space-x-1 border-l border-zinc-700 pl-2">
                <label class="flex items-center space-x-1 cursor-pointer hover:text-zinc-300" title="勾選時使用 Server-Sent Events (SSE) 串流通道，未勾選使用 WebSocket">
                  <input type="checkbox" id="checkUseSse" class="rounded bg-zinc-700 border-zinc-600 text-emerald-500">
                  <span>SSE 串流</span>
                </label>
              </div>

              <span id="agentStatus" class="text-emerald-400 font-mono hidden">● 思考中...</span>
            </div>
            <div class="flex items-center space-x-2">
              <button id="btnCancel" class="hidden px-2 py-1 bg-red-600/80 hover:bg-red-600 text-white rounded font-medium">中斷 (Cancel)</button>
              <button id="btnSend" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-medium">送出</button>
            </div>
          </div>
        </div>
      <!-- Terminal Bottom Drawer (Collapsible) -->
      <div id="terminalDrawer" class="hidden h-64 border-t border-zinc-800 bg-black flex flex-col shrink-0">
        <div class="px-3 py-1.5 bg-zinc-900 border-b border-zinc-800 flex justify-between items-center text-xs text-zinc-400">
          <div class="flex items-center space-x-2">
            <span class="font-mono text-emerald-400 font-bold">💻 Web Terminal</span>
            <span class="text-[10px] text-zinc-500">(PTY Shell)</span>
          </div>
          <div class="flex items-center space-x-2">
            <button id="btnClearTerminal" class="hover:text-zinc-200">Clear</button>
            <button id="btnCloseTerminal" class="hover:text-zinc-200 font-bold">✕</button>
          </div>
        </div>
        <div id="xtermContainer" class="flex-1 p-2 overflow-hidden"></div>
      </div>
    </main>

    <!-- Right Drawer: Unified Diff & Preview & MCP Topology -->
    <aside class="w-80 lg:w-96 bg-zinc-900 border-l border-zinc-800 flex flex-col shrink-0 hidden lg:flex" id="previewDrawer">
      <div class="p-2.5 border-b border-zinc-800 flex items-center justify-between text-xs font-semibold">
        <div class="flex items-center space-x-1">
          <button id="tabBtnPreview" class="px-2.5 py-1 rounded bg-zinc-800 text-emerald-400 font-medium">Preview / Diff</button>
          <button id="tabBtnMcp" class="px-2.5 py-1 rounded text-zinc-400 hover:text-zinc-200">🔌 MCP Servers</button>
        </div>
        <button id="btnClearPreview" class="text-zinc-500 hover:text-zinc-300 text-xs">清除</button>
      </div>

      <!-- Tab 1: Preview & Observations & Monaco Diff -->
      <div class="flex-1 flex flex-col overflow-hidden" id="previewTabWrapper">
        <div id="monacoDiffContainer" class="hidden h-64 border-b border-zinc-800 bg-[#1e1e1e] shrink-0"></div>
        <div class="flex-1 overflow-y-auto p-3 text-xs font-mono" id="previewContent">
          <div class="text-zinc-600 italic">當 Agent 呼叫工具或修改檔案時，即時 Observation 與 Diff 將顯示於此。</div>
        </div>
      </div>

      <!-- Tab 2: MCP Topology & Servers -->
      <div class="flex-1 overflow-y-auto p-3 text-xs space-y-3 hidden" id="mcpContent">
        <div class="flex justify-between items-center text-zinc-400 font-semibold border-b border-zinc-800 pb-2">
          <span>CONFIGURED MCP SERVERS</span>
          <button id="btnRefreshMcp" class="hover:text-white" title="Refresh">↻</button>
        </div>
        <div id="mcpList" class="space-y-2">
          <div class="text-zinc-500 italic">載入 MCP 設定中...</div>
        </div>
      </div>
    </aside>

  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let authToken = urlParams.get('token') || localStorage.getItem('cyc_token') || '';
    if (urlParams.get('token')) {
      localStorage.setItem('cyc_token', urlParams.get('token'));
    }

    let currentMode = 'agent';
    let currentSessionId = null;
    let ws = null;

    // Elements
    const chatContainer = document.getElementById('chatContainer');
    const promptInput = document.getElementById('promptInput');
    const btnSend = document.getElementById('btnSend');
    const btnCancel = document.getElementById('btnCancel');
    const agentStatus = document.getElementById('agentStatus');
    const welcomeHero = document.getElementById('welcomeHero');
    const sessionList = document.getElementById('sessionList');
    const fileTree = document.getElementById('fileTree');
    const previewContent = document.getElementById('previewContent');
    const selectProvider = document.getElementById('selectProvider');
    const selectModel = document.getElementById('selectModel');
    const checkAutoApprove = document.getElementById('checkAutoApprove');
    const selectStrategy = document.getElementById('selectStrategy');
    const inputMaxTurns = document.getElementById('inputMaxTurns');
    const checkUseSse = document.getElementById('checkUseSse');
    const monacoDiffContainer = document.getElementById('monacoDiffContainer');

    // Headers with Auth
    function getHeaders() {
      const headers = { 'Content-Type': 'application/json' };
      if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
      return headers;
    }

    // Init WebSocket
    function connectWebSocket() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}/ws/agent?token=${encodeURIComponent(authToken)}`;
      ws = new WebSocket(wsUrl);

      ws.onopen = () => console.log("WebSocket connected");
      ws.onclose = () => {
        console.log("WebSocket disconnected, reconnecting in 2s...");
        setTimeout(connectWebSocket, 2000);
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          handleAgentEvent(msg);
        } catch (e) {
          console.error("WS Parse error", e);
        }
      };
    }

    function handleAgentEvent(event) {
      if (welcomeHero) welcomeHero.style.display = 'none';

      if (event.type === 'thinking') {
        agentStatus.classList.remove('hidden');
        agentStatus.innerText = `● 思考與規劃中 (回合 ${event.turn}/${event.max_turns})...`;
        btnCancel.classList.remove('hidden');
      } else if (event.type === 'approval_request') {
        agentStatus.classList.remove('hidden');
        agentStatus.innerText = `⏳ 等待審批確認...`;
        addApprovalCard(event);
      } else if (event.type === 'tool_call') {
        addToolCallCard(event.name, event.arguments);
      } else if (event.type === 'tool_result') {
        addObservationCard(event.name, event.observation);
      } else if (event.type === 'message') {
        addAssistantMessage(event.content);
      } else if (event.type === 'turn_complete' || event.type === 'done') {
        agentStatus.classList.add('hidden');
        btnCancel.classList.add('hidden');
        if (event.session_id) {
          currentSessionId = event.session_id;
          fetch(`/api/sessions/${encodeURIComponent(currentSessionId)}`, { headers: getHeaders() })
            .then(res => res.json())
            .then(s => {
              if (s && s.estimated_tokens) {
                updateTokenUsage(s.estimated_tokens, s.max_context_tokens || 128000);
              }
            }).catch(() => {});
        }
        loadSessions();
      } else if (event.type === 'cancelled') {
        agentStatus.classList.add('hidden');
        btnCancel.classList.add('hidden');
        addSystemNotice("⚠️ 任務已由使用者中斷。");
      } else if (event.type === 'error') {
        agentStatus.classList.add('hidden');
        btnCancel.classList.add('hidden');
        addSystemNotice(`❌ 發生錯誤: ${event.error}`);
      }
    }

    function addMessageBubble(role, text) {
      const div = document.createElement('div');
      div.className = role === 'user' ? 'flex justify-end' : 'flex justify-start';

      const inner = document.createElement('div');
      inner.className = role === 'user'
        ? 'bg-emerald-600 text-white p-3 rounded-2xl max-w-2xl text-sm whitespace-pre-wrap'
        : 'bg-zinc-900 border border-zinc-800 text-zinc-100 p-4 rounded-2xl max-w-3xl text-sm prose prose-invert w-full';

      if (role === 'user') {
        inner.innerText = text;
      } else {
        inner.innerHTML = marked.parse(text);
      }

      div.appendChild(inner);
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function addAssistantMessage(content) {
      addMessageBubble('assistant', content);
    }

    function addApprovalCard(req) {
      const card = document.createElement('div');
      card.id = `approval_${req.approval_id}`;
      card.className = 'border-2 border-yellow-500/80 bg-yellow-950/20 p-4 rounded-xl text-xs space-y-3';
      card.innerHTML = `
        <div class="flex items-center justify-between text-yellow-400 font-bold text-sm">
          <span>⚠️ 待審批操作: ${req.tool_name}</span>
          <span class="text-[11px] bg-yellow-500/20 px-2 py-0.5 rounded border border-yellow-500/40">Action Required</span>
        </div>
        <div class="text-zinc-300 font-medium">${req.question}</div>
        <pre class="bg-black/60 p-2.5 rounded text-zinc-300 overflow-x-auto font-mono text-[11px] max-h-48">${JSON.stringify(req.arguments, null, 2)}</pre>
        ${req.diff ? `<div class="text-zinc-400 text-[11px] font-semibold">變更對比 (Unified Diff):</div><pre class="bg-zinc-900 border border-zinc-700 p-2.5 rounded text-zinc-200 overflow-x-auto font-mono text-[11px] max-h-56 whitespace-pre leading-relaxed">${req.diff}</pre>` : ''}
        <div class="flex items-center justify-end space-x-2 pt-2 border-t border-zinc-800">
          <button id="btnDeny_${req.approval_id}" class="px-4 py-1.5 bg-red-700 hover:bg-red-600 text-white rounded font-medium transition">拒絕 (Deny)</button>
          <button id="btnApprove_${req.approval_id}" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded font-medium transition">核准執行 (Approve)</button>
        </div>
      `;
      chatContainer.appendChild(card);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      if (req.orig_text !== undefined && req.new_text !== undefined && req.orig_text !== null && req.new_text !== null) {
        showMonacoDiff(req.orig_text, req.new_text);
        previewContent.innerHTML = `
          <div class="text-yellow-400 font-bold mb-1">Monaco Side-by-Side Diff: ${req.tool_name}</div>
          <div class="text-[10px] text-zinc-400 mb-2">上方雙欄為即時 Monaco 比對器，請審查並點擊 Approve 或 Deny</div>
        `;
      } else if (req.diff) {
        previewContent.innerHTML = `
          <div class="text-yellow-400 font-bold mb-1">Pending Approval: ${req.tool_name}</div>
          <div class="text-[10px] text-zinc-400 mb-2">請於主對話區審查並點擊 Approve 或 Deny</div>
          <pre class="p-2 bg-black/60 rounded text-zinc-200 text-[11px] overflow-x-auto whitespace-pre font-mono">${req.diff}</pre>
        `;
      }

      document.getElementById(`btnApprove_${req.approval_id}`).onclick = () => {
        if (ws) ws.send(JSON.stringify({ action: 'approve', approval_id: req.approval_id }));
        card.innerHTML = `<div class="text-emerald-400 font-medium py-1">✓ 已核准執行: ${req.tool_name}</div>`;
        card.className = 'border border-emerald-800/50 bg-emerald-950/10 p-3 rounded-xl text-xs';
        if (monacoDiffContainer) monacoDiffContainer.classList.add('hidden');
      };

      document.getElementById(`btnDeny_${req.approval_id}`).onclick = () => {
        if (ws) ws.send(JSON.stringify({ action: 'deny', approval_id: req.approval_id }));
        card.innerHTML = `<div class="text-red-400 font-medium py-1">✕ 已拒絕執行: ${req.tool_name}</div>`;
        card.className = 'border border-red-800/50 bg-red-950/10 p-3 rounded-xl text-xs';
        if (monacoDiffContainer) monacoDiffContainer.classList.add('hidden');
      };
    }

    function addToolCallCard(name, args) {
      const card = document.createElement('div');
      card.className = 'border border-cyan-800/60 bg-cyan-950/20 p-3 rounded-xl text-xs space-y-1.5';
      card.innerHTML = `
        <div class="flex items-center justify-between text-cyan-400 font-semibold">
          <span>⚡ Tool Call: ${name}</span>
          <span class="text-zinc-500 text-[10px]">Calling...</span>
        </div>
        <pre class="bg-black/40 p-2 rounded text-zinc-300 overflow-x-auto text-[11px]">${JSON.stringify(args, null, 2)}</pre>
      `;
      chatContainer.appendChild(card);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      // Update right drawer preview
      previewContent.innerHTML = `
        <div class="text-cyan-400 font-bold mb-1">Tool: ${name}</div>
        <pre class="p-2 bg-black/60 rounded text-zinc-300 text-[11px] overflow-x-auto">${JSON.stringify(args, null, 2)}</pre>
      `;
    }

    function addObservationCard(name, observation) {
      const card = document.createElement('div');
      card.className = 'border border-emerald-800/40 bg-emerald-950/10 p-3 rounded-xl text-xs space-y-1';
      const preview = observation.slice(0, 300) + (observation.length > 300 ? '...' : '');
      card.innerHTML = `
        <div class="text-emerald-400 font-semibold">✓ Observation: ${name}</div>
        <div class="text-zinc-300 whitespace-pre-wrap font-mono text-[11px]">${preview}</div>
      `;
      chatContainer.appendChild(card);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      // Update right drawer preview
      previewContent.innerHTML += `
        <div class="text-emerald-400 font-bold mt-3 mb-1">✓ Observation: ${name}</div>
        <pre class="p-2 bg-black/60 rounded text-zinc-300 text-[11px] overflow-x-auto whitespace-pre-wrap">${observation}</pre>
      `;
    }

    function addSystemNotice(text) {
      const div = document.createElement('div');
      div.className = 'text-center my-2 text-xs text-yellow-500';
      div.innerText = text;
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    let activeSseController = null;

    async function sendQuery() {
      const text = promptInput.value.trim();
      if (!text) return;

      const strategyVal = selectStrategy.value || 'standard';
      const maxTurnsVal = parseInt(inputMaxTurns.value) || 100;
      const useSse = checkUseSse.checked;

      addMessageBubble('user', text);
      promptInput.value = '';

      if (useSse) {
        // Run via Server-Sent Events (SSE)
        btnCancel.classList.remove('hidden');
        agentStatus.classList.remove('hidden');
        agentStatus.innerText = '● SSE 連線與串流中...';

        activeSseController = new AbortController();
        try {
          const res = await fetch('/api/events/sse', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({
              prompt: text,
              session_id: currentSessionId,
              mode: currentMode,
              provider: selectProvider.value || undefined,
              model: selectModel.value || undefined,
              auto_approve: checkAutoApprove.checked,
              strategy: strategyVal,
              max_turns: maxTurnsVal,
            }),
            signal: activeSseController.signal,
          });

          if (!res.ok) {
            throw new Error(`SSE 請求失敗: HTTP ${res.status}`);
          }

          const reader = res.body.getReader();
          const decoder = new TextDecoder('utf-8');
          let buffer = '';

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n\n');
            buffer = lines.pop(); // keep remainder

            for (const line of lines) {
              const trimmed = line.trim();
              if (trimmed.startsWith('data: ')) {
                try {
                  const eventData = JSON.parse(trimmed.slice(6));
                  handleAgentEvent(eventData);
                } catch (e) {
                  console.error("SSE parse error", e);
                }
              }
            }
          }
        } catch (err) {
          if (err.name === 'AbortError') {
            addSystemNotice("⚠️ SSE 串流已由使用者中斷。");
          } else {
            addSystemNotice(`❌ SSE 錯誤: ${err.message}`);
          }
        } finally {
          agentStatus.classList.add('hidden');
          btnCancel.classList.add('hidden');
          activeSseController = null;
        }
      } else {
        // Run via WebSocket
        if (!ws || ws.readyState !== WebSocket.OPEN) {
          alert("WebSocket 尚未連線，請稍候重試");
          return;
        }

        ws.send(JSON.stringify({
          action: 'query',
          prompt: text,
          session_id: currentSessionId,
          mode: currentMode,
          provider: selectProvider.value || undefined,
          model: selectModel.value || undefined,
          auto_approve: checkAutoApprove.checked,
          strategy: strategyVal,
          max_turns: maxTurnsVal,
        }));
      }
    }

    // Event Listeners
    btnSend.onclick = sendQuery;
    btnCancel.onclick = () => {
      if (activeSseController) {
        activeSseController.abort();
      }
      if (ws) ws.send(JSON.stringify({ action: 'cancel' }));
    };

    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendQuery();
      }
    });

    document.getElementById('btnModeAgent').onclick = () => {
      currentMode = 'agent';
      document.getElementById('btnModeAgent').className = 'px-2.5 py-1 rounded bg-emerald-600 text-white font-medium';
      document.getElementById('btnModeChat').className = 'px-2.5 py-1 rounded text-zinc-400 hover:text-white';
    };

    document.getElementById('btnModeChat').onclick = () => {
      currentMode = 'chat';
      document.getElementById('btnModeChat').className = 'px-2.5 py-1 rounded bg-emerald-600 text-white font-medium';
      document.getElementById('btnModeAgent').className = 'px-2.5 py-1 rounded text-zinc-400 hover:text-white';
    };

    document.getElementById('btnNewChat').onclick = () => {
      currentSessionId = null;
      chatContainer.innerHTML = '';
      if (welcomeHero) {
        chatContainer.appendChild(welcomeHero);
        welcomeHero.style.display = 'block';
      }
    };

    document.getElementById('btnClearPreview').onclick = () => {
      previewContent.innerHTML = '<div class="text-zinc-600 italic">清空完成。</div>';
    };

    // Load Metadata
    async function loadStatus() {
      try {
        const res = await fetch('/api/status', { headers: getHeaders() });
        if (res.status === 401) {
          const pass = prompt("請輸入 cyc Web 認證 Token:");
          if (pass) {
            authToken = pass;
            localStorage.setItem('cyc_token', pass);
            location.reload();
          }
          return;
        }
        const data = await res.json();
        document.getElementById('wsName').innerText = data.workspace_name || 'workspace';
        document.getElementById('appVersion').innerText = `v${data.version}`;
        if (data.agent_config && data.agent_config.auto_approve) {
          checkAutoApprove.checked = true;
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function loadProviders() {
      try {
        const res = await fetch('/api/providers', { headers: getHeaders() });
        const data = await res.json();
        selectProvider.innerHTML = '';
        data.providers.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p.name;
          opt.innerText = p.name;
          if (p.name === data.default_provider) opt.selected = true;
          selectProvider.appendChild(opt);
        });
        loadModels();
      } catch (e) {
        console.error(e);
      }
    }

    async function loadModels() {
      try {
        const prov = selectProvider.value;
        const res = await fetch(`/api/models?provider=${encodeURIComponent(prov)}`, { headers: getHeaders() });
        const data = await res.json();
        selectModel.innerHTML = '';
        if (data.models && data.models.length) {
          data.models.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m;
            opt.innerText = m;
            selectModel.appendChild(opt);
          });
        }
      } catch (e) {
        console.error(e);
      }
    }

    selectProvider.onchange = loadModels;

    async function loadSessions() {
      try {
        const res = await fetch('/api/sessions?source=all', { headers: getHeaders() });
        const data = await res.json();
        sessionList.innerHTML = '';
        data.sessions.forEach(s => {
          const sid = s.session_id || s.id;
          const displayTitle = s.title ? s.title : (s.preview || sid);
          const item = document.createElement('div');
          item.className = 'group p-2 rounded hover:bg-zinc-800 cursor-pointer text-zinc-300 truncate transition flex justify-between items-center';
          item.innerHTML = `
            <div class="truncate flex-1 pr-2">
              <div class="font-medium text-zinc-200 truncate" title="${sid}">${displayTitle}</div>
              <div class="text-[10px] text-zinc-500">${s.mode || 'agent'} · ${s.provider || 'local'}${s.title && s.preview ? ' · ' + s.preview : ''}</div>
            </div>
            <button class="opacity-0 group-hover:opacity-100 p-1 hover:text-emerald-400 text-zinc-500 text-xs transition" title="Rename Session">✏️</button>
          `;
          const renameBtn = item.querySelector('button');
          renameBtn.onclick = async (ev) => {
            ev.stopPropagation();
            const newTitle = prompt('Enter new session title:', s.title || '');
            if (newTitle !== null && newTitle.trim()) {
              try {
                await fetch(`/api/sessions/${encodeURIComponent(sid)}/rename`, {
                  method: 'POST',
                  headers: getHeaders(),
                  body: JSON.stringify({ title: newTitle.trim() }),
                });
                loadSessions();
              } catch (err) {
                console.error('Failed to rename session', err);
              }
            }
          };
          item.onclick = () => loadSessionDetail(sid);
          sessionList.appendChild(item);
        });
      } catch (e) {
        console.error(e);
      }
    }

    async function loadSessionDetail(sessionId) {
      try {
        const res = await fetch(`/api/sessions/${encodeURIComponent(sessionId)}`, { headers: getHeaders() });
        const session = await res.json();
        currentSessionId = session.session_id;
        updateTokenUsage(session.estimated_tokens || 0, session.max_context_tokens || 128000);
        chatContainer.innerHTML = '';
        if (session.messages) {
          session.messages.forEach(m => {
            if (m.role === 'user') {
              addMessageBubble('user', m.content);
            } else if (m.role === 'assistant') {
              if (m.content) addMessageBubble('assistant', m.content);
            }
          });
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function loadFiles(path = '') {
      try {
        const res = await fetch(`/api/files?path=${encodeURIComponent(path)}`, { headers: getHeaders() });
        const data = await res.json();
        fileTree.innerHTML = '';
        if (data.items) {
          data.items.forEach(item => {
            const row = document.createElement('div');
            row.className = 'truncate hover:text-emerald-400 cursor-pointer text-zinc-400 py-0.5';
            row.innerText = (item.is_dir ? '📁 ' : '📄 ') + item.name;
            row.onclick = () => {
              if (item.is_dir) {
                loadFiles(item.path);
              } else {
                fetchFileContent(item.path);
              }
            };
            fileTree.appendChild(row);
          });
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function fetchFileContent(filePath) {
      try {
        const res = await fetch(`/api/files?path=${encodeURIComponent(filePath)}`, { headers: getHeaders() });
        const data = await res.json();
        previewContent.innerHTML = `
          <div class="text-zinc-200 font-bold mb-1">${data.path}</div>
          <pre class="p-2 bg-black/60 rounded text-zinc-300 text-[11px] overflow-x-auto whitespace-pre">${data.content}</pre>
        `;
      } catch (e) {
        console.error(e);
      }
    }

    document.getElementById('btnRefreshSessions').onclick = loadSessions;
    document.getElementById('btnRefreshFiles').onclick = () => loadFiles('');

    // ------------------ Web Terminal (xterm.js) ------------------
    let term = null;
    let termFitAddon = null;
    let termWs = null;
    const terminalDrawer = document.getElementById('terminalDrawer');
    const btnToggleTerminal = document.getElementById('btnToggleTerminal');
    const btnCloseTerminal = document.getElementById('btnCloseTerminal');
    const btnClearTerminal = document.getElementById('btnClearTerminal');

    function initTerminal() {
      if (term) return;

      term = new Terminal({
        cursorBlink: true,
        fontSize: 12,
        fontFamily: 'Menlo, Monaco, "Courier New", monospace',
        theme: {
          background: '#09090b',
          foreground: '#f4f4f5',
          cursor: '#10b981',
          selectionBackground: '#27272a',
        }
      });

      termFitAddon = new FitAddon.FitAddon();
      term.loadAddon(termFitAddon);
      term.open(document.getElementById('xtermContainer'));
      termFitAddon.fit();

      // Connect Terminal WebSocket
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}/ws/terminal?token=${encodeURIComponent(authToken)}`;
      termWs = new WebSocket(wsUrl);

      termWs.onopen = () => {
        term.writeln('\x1b[32m✔ Connected to cyc Terminal session.\x1b[0m\r\n');
        sendTerminalResize();
      };

      termWs.onmessage = (e) => {
        term.write(e.data);
      };

      termWs.onclose = () => {
        term.writeln('\r\n\x1b[31m✖ Terminal session closed.\x1b[0m\r\n');
      };

      term.onData(data => {
        if (termWs && termWs.readyState === WebSocket.OPEN) {
          termWs.send(JSON.stringify({ type: 'input', data: data }));
        }
      });

      window.addEventListener('resize', () => {
        if (!terminalDrawer.classList.contains('hidden') && termFitAddon) {
          termFitAddon.fit();
          sendTerminalResize();
        }
      });
    }

    function sendTerminalResize() {
      if (term && termWs && termWs.readyState === WebSocket.OPEN) {
        termWs.send(JSON.stringify({
          type: 'resize',
          cols: term.cols,
          rows: term.rows,
        }));
      }
    }

    btnToggleTerminal.onclick = () => {
      const isHidden = terminalDrawer.classList.contains('hidden');
      if (isHidden) {
        terminalDrawer.classList.remove('hidden');
        btnToggleTerminal.classList.add('bg-zinc-700', 'text-emerald-400');
        initTerminal();
        setTimeout(() => {
          if (termFitAddon) termFitAddon.fit();
          sendTerminalResize();
          if (term) term.focus();
        }, 50);
      } else {
        terminalDrawer.classList.add('hidden');
        btnToggleTerminal.classList.remove('bg-zinc-700', 'text-emerald-400');
      }
    };

    btnCloseTerminal.onclick = () => {
      terminalDrawer.classList.add('hidden');
      btnToggleTerminal.classList.remove('bg-zinc-700', 'text-emerald-400');
    };

    btnClearTerminal.onclick = () => {
      if (term) term.clear();
    };

    // ------------------ Token Dashboard & Compact ------------------
    const tokenBar = document.getElementById('tokenBar');
    const tokenText = document.getElementById('tokenText');
    const btnCompact = document.getElementById('btnCompact');

    function updateTokenUsage(used, maxTokens = 128000) {
      if (!maxTokens || maxTokens <= 0) maxTokens = 128000;
      const pct = Math.min(100, Math.round((used / maxTokens) * 100));
      tokenBar.style.width = `${pct}%`;
      if (pct > 80) {
        tokenBar.className = 'bg-red-500 h-2 rounded-full transition-all duration-300';
      } else if (pct > 50) {
        tokenBar.className = 'bg-yellow-500 h-2 rounded-full transition-all duration-300';
      } else {
        tokenBar.className = 'bg-emerald-500 h-2 rounded-full transition-all duration-300';
      }
      tokenText.innerText = `${used.toLocaleString()} / ${Math.round(maxTokens / 1000)}k (${pct}%)`;
    }

    btnCompact.onclick = async () => {
      if (!currentSessionId) {
        alert("尚未選取或建立任何 Session，無法執行壓縮。");
        return;
      }
      btnCompact.innerText = "⚡ Compacting...";
      btnCompact.disabled = true;
      try {
        const res = await fetch(`/api/sessions/${encodeURIComponent(currentSessionId)}/compact?ratio=0.50`, {
          method: 'POST',
          headers: getHeaders(),
        });
        const data = await res.json();
        if (res.ok) {
          const r = data.result;
          addSystemNotice(`⚡ 上下文已壓縮！節省 ${r.saved_tokens} tokens (自 ${r.initial_tokens} 降至 ${r.final_tokens}，裁剪 ${r.pruned_count} 則舊訊息)。`);
          loadSessionDetail(currentSessionId);
        } else {
          alert(`壓縮失敗: ${data.detail || '未知錯誤'}`);
        }
      } catch (e) {
        alert(`壓縮發生錯誤: ${e}`);
      } finally {
        btnCompact.innerText = "⚡ Compact";
        btnCompact.disabled = false;
      }
    };

    // ------------------ MCP Servers & Topology Tab ------------------
    const tabBtnPreview = document.getElementById('tabBtnPreview');
    const tabBtnMcp = document.getElementById('tabBtnMcp');
    const previewTabContent = document.getElementById('previewContent');
    const mcpTabContent = document.getElementById('mcpContent');
    const mcpList = document.getElementById('mcpList');
    const btnRefreshMcp = document.getElementById('btnRefreshMcp');

    tabBtnPreview.onclick = () => {
      tabBtnPreview.className = 'px-2.5 py-1 rounded bg-zinc-800 text-emerald-400 font-medium';
      tabBtnMcp.className = 'px-2.5 py-1 rounded text-zinc-400 hover:text-zinc-200';
      previewTabContent.classList.remove('hidden');
      mcpTabContent.classList.add('hidden');
    };

    tabBtnMcp.onclick = () => {
      tabBtnMcp.className = 'px-2.5 py-1 rounded bg-zinc-800 text-emerald-400 font-medium';
      tabBtnPreview.className = 'px-2.5 py-1 rounded text-zinc-400 hover:text-zinc-200';
      mcpTabContent.classList.remove('hidden');
      previewTabContent.classList.add('hidden');
      loadMcpServers();
    };

    btnRefreshMcp.onclick = loadMcpServers;

    async function loadMcpServers() {
      mcpList.innerHTML = '<div class="text-zinc-500 italic">檢查 MCP 拓撲與狀態中...</div>';
      try {
        const res = await fetch('/api/mcp', { headers: getHeaders() });
        const data = await res.json();
        mcpList.innerHTML = '';
        if (!data.mcp_servers || data.mcp_servers.length === 0) {
          mcpList.innerHTML = `
            <div class="p-3 bg-zinc-950 border border-zinc-800 rounded-lg text-zinc-500 text-center">
              <div>🔌 尚未配置任何 MCP 伺服器</div>
              <div class="text-[10px] text-zinc-600 mt-1">可在 ~/.config/cyc/config.yaml 中的 mcp_servers 區塊定義。</div>
            </div>
          `;
          return;
        }

        data.mcp_servers.forEach(srv => {
          const card = document.createElement('div');
          const isOk = srv.is_available;
          card.className = `p-3 rounded-lg border text-xs space-y-1.5 ${isOk ? 'border-zinc-700 bg-zinc-950' : 'border-red-900/50 bg-red-950/20'}`;
          card.innerHTML = `
            <div class="flex items-center justify-between font-bold">
              <span class="${isOk ? 'text-emerald-400' : 'text-red-400'}">● ${srv.name}</span>
              <span class="text-[10px] px-1.5 py-0.5 rounded font-mono ${isOk ? 'bg-emerald-950/60 text-emerald-300 border border-emerald-800/40' : 'bg-red-950 text-red-300 border border-red-800/40'}">${srv.status}</span>
            </div>
            <div class="text-zinc-400 font-mono text-[11px] truncate" title="${srv.command_resolved}">
              <span class="text-zinc-500">Cmd:</span> ${srv.command} ${srv.args ? srv.args.join(' ') : ''}
            </div>
            <div class="text-zinc-500 text-[10px] truncate" title="${srv.cwd}">
              <span>Dir:</span> ${srv.cwd}
            </div>
          `;
          mcpList.appendChild(card);
        });
      } catch (e) {
        mcpList.innerHTML = `<div class="text-red-400">載入 MCP 失敗: ${e}</div>`;
      }
    }

    // ------------------ Monaco Diff Editor Integration ------------------
    let monacoDiffEditor = null;
    let monacoLoaded = false;

    function initMonacoDiff() {
      if (typeof require === 'undefined') return;
      require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } });
      require(['vs/editor/editor.main'], function () {
        monacoLoaded = true;
      });
    }

    function showMonacoDiff(originalText, modifiedText, language = 'python') {
      if (!monacoDiffContainer) return;
      monacoDiffContainer.classList.remove('hidden');

      if (!monacoLoaded || typeof monaco === 'undefined') {
        // Fallback if Monaco hasn't finished loading yet
        monacoDiffContainer.innerHTML = `
          <div class="p-2 text-zinc-400 text-xs">Monaco Diff 比對器初始化中...</div>
        `;
        setTimeout(() => showMonacoDiff(originalText, modifiedText, language), 500);
        return;
      }

      if (!monacoDiffEditor) {
        monacoDiffContainer.innerHTML = '';
        monacoDiffEditor = monaco.editor.createDiffEditor(monacoDiffContainer, {
          theme: 'vs-dark',
          readOnly: true,
          renderSideBySide: true,
          automaticLayout: true,
          fontSize: 11,
          minimap: { enabled: false },
          scrollBeyondLastLine: false,
        });
      }

      const origModel = monaco.editor.createModel(originalText, language);
      const modModel = monaco.editor.createModel(modifiedText, language);
      monacoDiffEditor.setModel({
        original: origModel,
        modified: modModel,
      });
    }

    // Startup
    initMonacoDiff();
    loadStatus();
    loadProviders();
    loadSessions();
    loadFiles();
    connectWebSocket();
  </script>
</body>
</html>
